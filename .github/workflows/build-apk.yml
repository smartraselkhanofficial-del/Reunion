name: Build Android App (Direct APK & Seamless Update)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Complete Android Project
        run: |
          # যদি android ফোল্ডারে build.gradle না থাকে, তবে ফ্রেশ প্রজেক্ট তৈরি করা
          if [ ! -f "android/app/build.gradle" ]; then
            [ -f android/app/permanent_debug.keystore ] && cp android/app/permanent_debug.keystore /tmp/permanent.keystore || true
            rm -rf android
            npx cap add android
            mkdir -p android/app
            [ -f /tmp/permanent.keystore ] && cp /tmp/permanent.keystore android/app/permanent_debug.keystore || true
          fi
          npx cap sync android

      - name: Setup Permanent Signing Key and Increment Version
        run: |
          # ভার্সন কোড বৃদ্ধি
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle || true

          # মাইক্রোফোন ও সিস্টেম পারমিশন ইনজেকশন
          sed -i '/<\/manifest>/i \
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' android/app/src/main/AndroidManifest.xml || true

          # স্থায়ী ডিজিটাল কি নিশ্চিত করা
          mkdir -p ~/.android
          if [ ! -f android/app/permanent_debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 -keystore android/app/permanent_debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sandikona2014,OU=Reunion,O=Sandikona,L=Kendua,C=BD" || true
          fi
          cp android/app/permanent_debug.keystore ~/.android/debug.keystore || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish Direct APK File (No Zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          gh release create "$RELEASE_TAG" "android/app/build/outputs/apk/debug/app-debug.apk#Reunion-2027.apk" --title "Reunion 2027 Update #${{ github.run_number }}" --notes "সরাসরি আপডেটযোগ্য অফিশিয়াল APK"
