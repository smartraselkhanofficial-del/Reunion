name: Build Android App (Release & Update Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies 
        run: npm install

      - name: Build Web Assets
        run: |
          sed -i 's/´/`/g' src/App.tsx
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Permanent Release Key & Permissions
        run: |
          # অ্যান্ড্রয়েড পারমিশন ইনজেকশন
          sed -i '/<\/manifest>/i \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.VIBRATE" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml || true

          # ভার্সন কোড বৃদ্ধি
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle

          # স্থায়ী ইউনিক রিলিজ কি-স্টোর তৈরি (একই কি থাকবে সবসময়)
          keytool -genkeypair -v -storetype PKCS12 -keystore android/app/sandikona_release.keystore -storepass Sandikona2027Pass -alias sandikona_key -keypass Sandikona2027Pass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Smart Rasel Khan, OU=Reunion2027, O=Sandikona School, L=Kendua, ST=Netrokona, C=BD" || true

      - name: Build Signed APK & Play Store Bundle (AAB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          # প্লে স্টোরে আপলোডের জন্য AAB ফাইলও তৈরি হবে
          ./gradlew bundleRelease || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reunion-2027-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Reunion-2027-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
