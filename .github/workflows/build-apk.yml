name: Build Android App (Direct APK Download)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Microphone Permissions
        run: |
          sed -i '/<\/manifest>/i \
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' android/app/src/main/AndroidManifest.xml || true

          keytool -genkeypair -v -storetype PKCS12 -keystore android/app/sandikona_release.keystore -storepass Sandikona2027Pass -alias sandikona_key -keypass Sandikona2027Pass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Smart Rasel Khan, OU=Reunion2027, O=Sandikona School, L=Kendua, ST=Netrokona, C=BD" || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish Direct APK File (No Zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.$(date +%s)"
          gh release create "$RELEASE_TAG" "android/app/build/outputs/apk/debug/app-debug.apk#Reunion-2027.apk" --title "Reunion 2027 Official App" --notes "সরাসরি ইনস্টলযোগ্য APK ফাইল (কোনো জিপ ছাড়াই)"
